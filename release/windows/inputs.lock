# Every file the Zeo Windows build guest installs, pinned by sha256: name<TAB>url<TAB>sha256.
# build-answers.sh and provision.ps1 refuse a file whose hash differs. A version is taken only
# once it is at least seven days old; the date it was published follows each entry as a comment.
# GitHub hashes are the release asset digests GitHub reports; the others were measured on
# download, 2026-11-17.
#
# Win32-OpenSSH 10.4.0.0p1 (2026-10-20).
