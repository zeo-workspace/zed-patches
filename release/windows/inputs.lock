# PowerShell 7.6.9 (2026-10-25); 7.6.10 (2026-11-10) was not yet seven days old. Zed's
# bundle-windows.ps1 and generate-licenses.ps1 need 7: `? :` does not parse in Windows
# PowerShell 5.1, and only 7 stops on a failing native command
# ($PSNativeCommandUseErrorActionPreference).
PowerShell-win-x64.msi	https://github.com/PowerShell/PowerShell/releases/download/v7.6.9/PowerShell-7.6.9-win-x64.msi	50d33c7494aaf82b987cfd4de3f232d04f91fdd4c0deeca8a669cced3e7cf8f9
# Visual Studio 2022 Community bootstrapper, measured 2026-11-17. Microsoft publishes only the
# moving aka.ms link, so this hash pins today's bootstrapper and fails loudly when it changes;
# the components it then fetches are checked by the installer's own signatures, not by this
# file, and provision.ps1 records the installed version. Community, because bundle-windows.ps1
# opens "Microsoft Visual Studio\2022\Community"'s developer shell.
vs_community.exe	https://aka.ms/vs/17/release/vs_community.exe	051dffb68c39b9a4f15b830fdae8d08dd5620369e923262c46f27e07a428a68c
